name: Production Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'media/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag & Production Release
    runs-on: ${{ vars.SDLC_RUNS_ON || 'ubuntu-latest' }}

    steps:
      - name: Require Self-Hosted Runner Policy
        if: github.repository == 'fmatar/agentic-sdlc-framework' && runner.environment == 'github-hosted'
        run: |
          echo "::error::This repository must run exclusively on self-hosted runners (configure vars.SDLC_RUNS_ON)."
          exit 1

      - name: Enforce Main Branch Policy
        env:
          CURRENT_REF: ${{ github.ref }}
        run: |
          if [ "$CURRENT_REF" != "refs/heads/main" ]; then
            echo "::error::Production releases may only execute from refs/heads/main (got '$CURRENT_REF')."
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci --no-audit --no-fund
          elif [ -f "package.json" ]; then
            npm install --no-audit --no-fund
          fi

      - name: Verify Quality Gate & Signed Stage 7 Receipt
        env:
          SDLC_RECEIPT_KEY: ${{ secrets.SDLC_RECEIPT_KEY }}
        run: |
          node .agent/scripts/sdlc-engine.mjs config check
          node .agent/scripts/sdlc-engine.mjs verify --chain-only
          node .agent/scripts/sdlc-engine.mjs gate --no-cache
          if [ -z "$SDLC_RECEIPT_KEY" ]; then
            echo "::error::Missing SDLC_RECEIPT_KEY secret: production release requires verified Stage 7 receipt."
            exit 1
          fi
          node .agent/scripts/sdlc-engine.mjs verify

      - name: Inspect Package Version & Release Tag
        id: version_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")
          IS_PRIVATE=$(node -p "Boolean(require('./package.json').private)")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "pkg_name=${PKG_NAME}" >> $GITHUB_OUTPUT
          echo "is_private=${IS_PRIVATE}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "Release tag ${TAG} already exists."
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "Release tag ${TAG} does not exist. Tag will be created."
          fi
          RELEASE_EXISTS=false
          if command -v gh >/dev/null 2>&1 && gh release view "${TAG}" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
          elif node -e "
            const https = require('node:https');
            const [owner, repo] = (process.env.GITHUB_REPOSITORY || '').split('/');
            const tag = process.argv[1] || '';
            if (!owner || !repo || !tag) process.exit(1);
            const req = https.get({
              hostname: 'api.github.com',
              path: '/repos/' + owner + '/' + repo + '/releases/tags/' + encodeURIComponent(tag),
              headers: {
                'User-Agent': 'agentic-sdlc-release',
                'Authorization': 'token ' + (process.env.GH_TOKEN || '')
              }
            }, (res) => {
              res.resume();
              process.exit(res.statusCode === 200 ? 0 : 1);
            });
            req.on('error', () => process.exit(1));
          " "${TAG}" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
          fi
          if [ "$RELEASE_EXISTS" = "true" ]; then
            echo "release_exists=true" >> $GITHUB_OUTPUT
            echo "GitHub Release ${TAG} already exists."
          else
            echo "release_exists=false" >> $GITHUB_OUTPUT
            echo "GitHub Release ${TAG} does not exist. Release will be created."
          fi
          if [ "$IS_PRIVATE" = "true" ]; then
            echo "npm_published=true" >> $GITHUB_OUTPUT
            echo "Package is marked private; skipping npm registry publish."
          elif npm view "${PKG_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "npm_published=true" >> $GITHUB_OUTPUT
            echo "Package ${PKG_NAME}@${VERSION} is already published on npm."
          else
            echo "npm_published=false" >> $GITHUB_OUTPUT
            echo "Package ${PKG_NAME}@${VERSION} is not yet published on npm."
          fi

      - name: Extract Release Notes from CHANGELOG.md
        if: steps.version_check.outputs.release_exists == 'false'
        id: release_notes
        env:
          VERSION: ${{ steps.version_check.outputs.version }}
          TAG: ${{ steps.version_check.outputs.tag }}
        run: |
          awk -v ver="$VERSION" '
            { sub(/\r$/, "") }
            index($0, "## [" ver "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md || true
          if [ ! -s release-notes.md ]; then
            echo "### Release $TAG" > release-notes.md
            echo "Production release triggered by merging 'develop' into 'main'." >> release-notes.md
          fi
          cat release-notes.md

      - name: Create Git Tag & GitHub Release
        if: steps.version_check.outputs.tag_exists == 'false' || steps.version_check.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version_check.outputs.tag }}
          VERSION: ${{ steps.version_check.outputs.version }}
          TAG_EXISTS: ${{ steps.version_check.outputs.tag_exists }}
          RELEASE_EXISTS: ${{ steps.version_check.outputs.release_exists }}
        run: |
          if [ "${TAG_EXISTS}" = "false" ]; then
            git config --local user.name "github-actions[bot]"
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
          if [ "${RELEASE_EXISTS}" = "false" ]; then
            if command -v gh >/dev/null 2>&1; then
              gh release create "$TAG" \
                --title "Release $TAG" \
                --notes-file release-notes.md
            else
              node -e "
                const fs = require('node:fs');
                const https = require('node:https');
                const body = fs.readFileSync('release-notes.md', 'utf8');
                const payload = JSON.stringify({
                  tag_name: process.env.TAG,
                  name: 'Release ' + process.env.TAG,
                  body,
                  draft: false,
                  prerelease: false
                });
                const [owner, repo] = (process.env.GITHUB_REPOSITORY || '').split('/');
                const req = https.request({
                  hostname: 'api.github.com',
                  path: '/repos/' + owner + '/' + repo + '/releases',
                  method: 'POST',
                  headers: {
                    'User-Agent': 'agentic-sdlc-release',
                    'Authorization': 'token ' + process.env.GH_TOKEN,
                    'Content-Type': 'application/json',
                    'Content-Length': Buffer.byteLength(payload)
                  }
                }, res => {
                  let data = '';
                  res.on('data', chunk => data += chunk);
                  res.on('end', () => {
                    console.log('GitHub Release API Status:', res.statusCode);
                    if (res.statusCode === 422 && data.includes('already_exists')) {
                      console.log('GitHub Release already exists (already_exists); continuing idempotently.');
                      return;
                    }
                    if (res.statusCode >= 400) {
                      console.error('API Error:', data);
                      process.exit(1);
                    }
                    console.log('GitHub Release created successfully via REST API.');
                  });
                });
                req.on('error', err => { console.error(err); process.exit(1); });
                req.write(payload);
                req.end();
              "
            fi
          fi

      - name: Publish Package to NPM (When NPM_TOKEN is configured)
        if: steps.version_check.outputs.npm_published == 'false' && steps.version_check.outputs.is_private == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            echo "Publishing package to npm registry..."
            npm publish --access public
          else
            echo "NPM_TOKEN secret is not set; skipping live npm publish."
            echo "Verifying package packing integrity via npm pack --dry-run..."
            npm pack --dry-run
          fi
