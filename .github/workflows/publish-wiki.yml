name: Publish Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ${{ vars.SDLC_RUNS_ON || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync Wiki
        run: |
          # Set up git config
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Clone the wiki repository
          echo "Cloning GitHub Wiki repository..."
          if ! git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" /tmp/wiki 2>/dev/null; then
            echo "::error title=Wiki Repository Not Initialized::The wiki git repository for ${{ github.repository }} does not exist yet. To initialize it, navigate to https://github.com/${{ github.repository }}/wiki in your browser and click 'Create the first page'. Once initialized, re-run this workflow."
            exit 1
          fi

          # Copy all files from our wiki directory to the wiki repository
          cp -r wiki/* /tmp/wiki/

          # Commit and push changes
          cd /tmp/wiki
          git add .
          if git diff-index --quiet HEAD; then
            echo "No changes to commit. Wiki is up to date."
          else
            git commit -m "docs: auto-publish wiki from repository"
            git push origin HEAD:master
          fi
