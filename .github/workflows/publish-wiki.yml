name: Publish Wiki

on:
  push:
    branches:
      - main
    paths:
      - "wiki/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ${{ vars.SDLC_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Sync Wiki
        env:
          WIKI_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIKI_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          WIKI_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/wiki.XXXXXX")"
          trap 'rm -rf "$WIKI_DIR"' EXIT

          echo "Cloning GitHub Wiki repository..."
          if ! git clone "https://x-access-token:${WIKI_TOKEN}@github.com/${WIKI_REPO}.wiki.git" "$WIKI_DIR" 2>/dev/null; then
            echo "::error title=Wiki Repository Not Initialized::The wiki git repository for ${WIKI_REPO} does not exist yet. To initialize it, navigate to https://github.com/${WIKI_REPO}/wiki in your browser and click 'Create the first page'. Once initialized, re-run this workflow."
            exit 1
          fi

          git -C "$WIKI_DIR" config user.name "github-actions[bot]"
          git -C "$WIKI_DIR" config user.email "github-actions[bot]@users.noreply.github.com"

          cp -r wiki/* "$WIKI_DIR"/

          git -C "$WIKI_DIR" add .
          if git -C "$WIKI_DIR" diff-index --quiet HEAD; then
            echo "No changes to commit. Wiki is up to date."
          else
            git -C "$WIKI_DIR" commit -m "docs: auto-publish wiki from repository"
            git -C "$WIKI_DIR" push origin HEAD:master
          fi
